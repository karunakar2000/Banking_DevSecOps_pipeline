# monitoring/prometheus-values.yaml
# Prometheus values for DTB BankingOnline workloads on AKS

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alertmanager:
  enabled: false

pushgateway:
  enabled: false

server:
  retention: 15d
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  service:
    type: ClusterIP

  extraScrapeConfigs:
    # Extra jobs to scrape the banking application
    - job_name: 'banking-online'
      metrics_path: /actuator/prometheus
      scrape_interval: 15s
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: keep
          regex: banking-online
        - source_labels: [__meta_kubernetes_pod_container_port_name]
          action: keep
          regex: http

scrapeConfigs: []

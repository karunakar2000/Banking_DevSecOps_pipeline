apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "banking-app.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "banking-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.SPRING_PROFILES_ACTIVE | quote }}
  JAVA_OPTS: {{ .Values.config.JAVA_OPTS | quote }}
  APP_ENV: {{ .Values.app.envName | quote }}

# File: azure-pipelines/azure-pipelines-infra-aws.yml
# Purpose: Provision and manage DTB Bank AWS infrastructure (VPC, subnets, EC2, etc.)

trigger:
  branches:
    include:
      - main
      - infra/*
  paths:
    include:
      - infra/terraform-aws/*
      - azure-pipelines/azure-pipelines-infra-aws.yml

# Run manually for most infra changes (recommended)
pr: none

# Manual parameters (you choose env + action when running the pipeline)
parameters:
  - name: environment
    displayName: "Environment"
    type: string
    default: "dev"
    values:
      - dev
      - uat
      - prod

  - name: action
    displayName: "Terraform Action"
    type: string
    default: "plan"
    values:
      - plan
      - apply
      - destroy

pool:
  name: LinuxAgentPool
  demands:
    - Terraform -equals Yes

variables:
  # Variable group holding AWS credentials and common settings:
  #   aws_access_key
  #   aws_secret_key
  #   aws_region
  - group: AWS_INFRA

  # Terraform working directory for AWS infra
  - name: TF_WORKDIR
    value: infra/terraform-aws

  # Optional backend config file inside TF_WORKDIR (if you are using S3 backend)
  - name: TF_BACKEND_CONFIG_FILE
    value: "backend.hcl"

stages:
  
  # 1. Validate Terraform configuration
  - stage: Validate
    displayName: "Terraform Validate (AWS)"
    jobs:
      - job: tf_validate
        displayName: "terraform validate ${{ parameters.environment }}"
        steps:
          - checkout: self
            clean: true

          - bash: |
              echo "Environment: ${{ parameters.environment }}"
              echo "Terraform version:"
              terraform version
            displayName: "Check Terraform version"

          - bash: |
              cd $(TF_WORKDIR)
              echo "Working directory: $(pwd)"
              ls -al
              
              # Initialize Terraform backend if configured
              if [ -f "$(TF_BACKEND_CONFIG_FILE)" ]; then
                echo "Initializing backend with $(TF_BACKEND_CONFIG_FILE)"
                terraform init -backend-config=$(TF_BACKEND_CONFIG_FILE)
              else
                echo "Initializing backend with default configuration"
                terraform init
              fi

              # Validate Terraform code
              terraform validate
            displayName: "Terraform init & validate"
            env:
              AWS_ACCESS_KEY_ID: $(aws_access_key)
              AWS_SECRET_ACCESS_KEY: $(aws_secret_key)
              AWS_DEFAULT_REGION: $(aws_region)

  # 2. Plan (default action for safety)
  - stage: Plan
    displayName: "Terraform Plan (AWS)"
    dependsOn: Validate
    condition: and(succeeded(), eq('${{ parameters.action }}', 'plan'))
    jobs:
      - job: tf_plan
        displayName: "terraform plan ${{ parameters.environment }}"
        steps:
          - checkout: self
            clean: true

          - bash: |
              cd $(TF_WORKDIR)
              echo "Running terraform plan for environment: ${{ parameters.environment }}"
              ls -al

              # By convention, we expect env-specific tfvars like:
              #   dev.tfvars, uat.tfvars, prod.tfvars
              TFVARS_FILE="${{ parameters.environment }}.tfvars"

              if [ ! -f "$TFVARS_FILE" ]; then
                echo "ERROR: Expected tfvars file '$TFVARS_FILE' not found in $(pwd)."
                exit 1
              fi

              if [ -f "$(TF_BACKEND_CONFIG_FILE)" ]; then
                terraform init -backend-config=$(TF_BACKEND_CONFIG_FILE)
              else
                terraform init
              fi

              terraform plan \
                -var "aws_access_key=$(aws_access_key)" \
                -var "aws_secret_key=$(aws_secret_key)" \
                -var-file="$TFVARS_FILE" \
                -out="plan-${{ parameters.environment }}.tfplan"

              echo "Plan generated: plan-${{ parameters.environment }}.tfplan"
            displayName: "Terraform plan"
            env:
              AWS_ACCESS_KEY_ID: $(aws_access_key)
              AWS_SECRET_ACCESS_KEY: $(aws_secret_key)
              AWS_DEFAULT_REGION: $(aws_region)

          - task: PublishBuildArtifacts@1
            displayName: "Publish Terraform plan artifact"
            inputs:
              PathtoPublish: "$(TF_WORKDIR)"
              ArtifactName: "tfplan-${{ parameters.environment }}"
              publishLocation: "Container"

  # 3. Apply (requires manual run with action=apply)
  - stage: Apply
    displayName: "Terraform Apply (AWS)"
    dependsOn: Validate
    condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))
    jobs:
      - job: tf_apply
        displayName: "terraform apply ${{ parameters.environment }}"
        steps:
          - checkout: self
            clean: true

          - bash: |
              cd $(TF_WORKDIR)
              echo "Running terraform apply for environment: ${{ parameters.environment }}"
              TFVARS_FILE="${{ parameters.environment }}.tfvars"

              if [ ! -f "$TFVARS_FILE" ]; then
                echo "ERROR: Expected tfvars file '$TFVARS_FILE' not found."
                exit 1
              fi

              if [ -f "$(TF_BACKEND_CONFIG_FILE)" ]; then
                terraform init -backend-config=$(TF_BACKEND_CONFIG_FILE)
              else
                terraform init
              fi

              terraform plan \
                -var "aws_access_key=$(aws_access_key)" \
                -var "aws_secret_key=$(aws_secret_key)" \
                -var-file="$TFVARS_FILE" \
                -out="plan-${{ parameters.environment }}.tfplan"

              echo "Applying terraform plan for ${{ parameters.environment }}..."
              terraform apply -auto-approve "plan-${{ parameters.environment }}.tfplan"
            displayName: "Terraform plan & apply"
            env:
              AWS_ACCESS_KEY_ID: $(aws_access_key)
              AWS_SECRET_ACCESS_KEY: $(aws_secret_key)
              AWS_DEFAULT_REGION: $(aws_region)

  # 4. Destroy (requires manual run with action=destroy)
  - stage: Destroy
    displayName: "Terraform Destroy (AWS)"
    dependsOn: Validate
    condition: and(succeeded(), eq('${{ parameters.action }}', 'destroy'))
    jobs:
      - job: tf_destroy
        displayName: "terraform destroy ${{ parameters.environment }}"
        steps:
          - checkout: self
            clean: true

          - bash: |
              cd $(TF_WORKDIR)
              echo "Running terraform destroy for environment: ${{ parameters.environment }}"
              TFVARS_FILE="${{ parameters.environment }}.tfvars"

              if [ ! -f "$TFVARS_FILE" ]; then
                echo "ERROR: Expected tfvars file '$TFVARS_FILE' not found."
                exit 1
              fi

              if [ -f "$(TF_BACKEND_CONFIG_FILE)" ]; then
                terraform init -backend-config=$(TF_BACKEND_CONFIG_FILE)
              else
                terraform init
              fi

              terraform destroy \
                -var "aws_access_key=$(aws_access_key)" \
                -var "aws_secret_key=$(aws_secret_key)" \
                -var-file="$TFVARS_FILE" \
                -auto-approve
            displayName: "Terraform destroy"
            env:
              AWS_ACCESS_KEY_ID: $(aws_access_key)
              AWS_SECRET_ACCESS_KEY: $(aws_secret_key)
              AWS_DEFAULT_REGION: $(aws_region)
